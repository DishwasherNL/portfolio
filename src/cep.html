<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
  <meta name="robots" content="noindex, nofollow">
  <title>CEP Test Tool, Arthur Wubbels</title>
</head>

<body>
<script src="../script.js" defer></script>

<div class="main">

  <main class="content" id="content">

    <article class="case-panel active" id="cep">

      <a class="back-link" href="../index.html">
        <svg class="back-link-icon" width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
          <path d="M0 0H14V14H13V1.705L1.354 13.354L0.646 12.646L12.292 1H0Z"/>
        </svg>
        <span>Back</span>
      </a>

      <div class="case-intro">
        <p class="section-label" id="cep-title"></p>
        <div class="case-meta">
          <span>Front-end development</span>
          <span>2025</span>
          <span>Resato Hydrogen Technology</span>
        </div>
      </div>

      <div class="case-image">
        <div class="slide active" id="Cep1"><img src="../img/resato/RES_CEP1.webp"></div>
        <div class="slide" id="Cep2"><img src="../img/resato/RES_CEP2.webp"></div>
        <div class="slide" id="Cep3"><img src="../img/resato/RES_CEP3.webp"></div>
        <div class="slide" id="Cep4"><img src="../img/resato/RES_CEP4.webp"></div>
        <div class="slide" id="Cep5"><img src="../img/resato/RES_CEP5.webp"></div>
        <button class="slide-btn prev" onclick="slideNav(this,-1)">&#8249;</button>
        <button class="slide-btn next" onclick="slideNav(this,1)">&#8250;</button>
      </div>

      <div class="case-intro">
        <p class="section-label">About this project</p>
        <p id="cep-intro"></p>
      </div>

      <div class="case-role">
        <p class="section-label">My role</p>
        <p id="cep-role"></p>
      </div>

      <div class="case-refl">
        <p class="section-label">The challenge</p>
        <p id="cep-challenge"></p>
      </div>

      <div class="case-refl">
        <p class="section-label">Approach</p>
        <p id="cep-approach"></p>
      </div>

      <div class="case-refl">
        <p class="section-label">Result &amp; reflection</p>
        <p id="cep-result-p1"></p>
        <p id="cep-result-p2"></p>
        <div class="kpi-grid">
          <div class="kpi-tile">
            <span class="kpi-value" id="cep-kpi1-value"></span>
            <span class="kpi-label" id="cep-kpi1-label"></span>
          </div>
          <div class="kpi-tile">
            <span class="kpi-value" id="cep-kpi2-value"></span>
            <span class="kpi-label" id="cep-kpi2-label"></span>
          </div>
          <div class="kpi-tile">
            <span class="kpi-value" id="cep-kpi3-value"></span>
            <span class="kpi-label" id="cep-kpi3-label"></span>
          </div>
        </div>
      </div>

    </article>

  </main>
</div>

</body>
</html>
